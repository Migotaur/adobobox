name: Deploy Adobobox to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Angular for Pages
        run: npm run build -- --base-href /adobobox/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/adobobox/browser

      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
