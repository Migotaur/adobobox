<article class="box" [class.box-dark]="theme === 'dark'">
  <header class="box-heading">
    <h2>{{ title }}</h2>
  </header>
  @if (adobos.length) {
  <ul>
    @for (adobo of adobos; track adobo.name) {
      <li>
        <a [attr.href]="adobo.url || null" [class.placeholder]="!adobo.url" [attr.aria-disabled]="!adobo.url ? true : null" [attr.target]="adobo.url ? '_blank' : null" rel="noopener noreferrer">
          <svg class="adobo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            @switch (adobo.icon) {
              @case ('play') {
                <path d="M8 3h8l5 9-5 9H8l-5-9Z" /><path d="m10 8 6 4-6 4Z" />
              }
              @case ('radio') {
                <rect x="3" y="8" width="18" height="13" rx="2" /><path d="m6 8 12-5M6 12h12M7 16h.01M11 16h.01" /><circle cx="17" cy="17" r="1.5" />
              }
              @case ('window') {
                <rect x="4" y="3" width="16" height="18" rx="1" /><path d="M12 3v18M4 12h16M2 21h20" />
              }
              @case ('book') {
                <path d="M12 5v16M12 5C8 2 3 3 3 3v15s5-1 9 3c4-4 9-3 9-3V3s-5-1-9 2Z" />
              }
              @case ('heart') {
                <path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1s-1 7 8 15c9-8 11-12 8-15Z" /><path d="M6 12h3l2-3 2 6 2-3h3" />
              }
              @case ('tools') {
                <rect x="3" y="7" width="18" height="14" rx="2" /><path d="M8 7V3h8v4M3 12h18M10 12v3h4v-3" />
              }
              @default {
                <circle cx="12" cy="12" r="9" /><ellipse cx="12" cy="12" rx="4" ry="9" /><path d="M3 12h18" />
              }
            }
          </svg>
          <span class="adobo-copy"><span class="adobo-name">{{ adobo.name }}</span><span class="adobo-description">{{ adobo.description }}</span></span>
          @if (adobo.url) { <span class="sr-only"> (opens in a new tab)</span> } @else { <span class="coming-soon">Soon</span> }
        </a>
      </li>
    }
  </ul>
  <footer>{{ adobos.length }} adobos inside</footer>
  } @else {
    <div class="empty-box">
      <span class="empty-symbol" aria-hidden="true">&#10022;</span>
      <p>{{ emptyMessage }}</p>
    </div>
  }
</article>
