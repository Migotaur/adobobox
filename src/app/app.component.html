<div class="paper-doodles" aria-hidden="true">
  @for (design of backgroundDoodles; track $index) {
    <div [class]="'doodle ' + design"></div>
  }
</div>
<header class="paper-header">
  <div class="paper-header-content">
    <div class="paper-brand-row">
      <img class="paper-brand-icon" src="favicon-32x32.png" srcset="favicon-32x32.png 1x, android-chrome-192x192.png 2x" width="40" height="40" alt="" draggable="false" />
      <span class="paper-brand">AdoboBox</span>
    </div>
    <span class="paper-tagline">An Online Toolbox with Flavor</span>
  </div>
</header>
<main class="page-main">
  <!-- Add page content here; routed pages also receive the background fade. -->
  <div class="page-content">
    <h1 style="display: flex; justify-content: center; text-align: center;">
      Site Under Construction. Most links and features are currently placeholder. Last Updated: 2026-11-15
    </h1>
    <div class="boxes-grid">
      <app-adobobox
        title="Awesome Websites"
        color="#eee5ff"
        [adobos]="awesomeWebsites"
      />
      <app-adobobox title="Education" color="#deedff" [adobos]="educationAdobos" />
      <app-adobobox title="Health &amp; Wellness" color="#dff2dd" [adobos]="healthAdobos" />
      <app-adobobox title="Everyday Tools" color="#ffe1ce" [adobos]="everydayAdobos" />
      <app-adobobox
        title="Coming Soon"
        color="#29272e"
        theme="dark"
        emptyMessage="More Boxes. More Adobos. More flavor. New things are on the way!"
      />
    </div>
    <router-outlet />
  </div>
</main>
<footer class="paper-footer">
  <p>&copy; 2026 <a target="_blank" href="https://www.miggledev.com">Miguel Campbell</a>. All Bugs Reserved.</p>
</footer>
